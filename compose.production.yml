name: fitness-app-production

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fitness_production}
      POSTGRES_USER: ${POSTGRES_USER:-fitness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the production environment file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE in the production environment file}
      POSTGRES_DB: ${POSTGRES_DB:-fitness_production}
      POSTGRES_USER: ${POSTGRES_USER:-fitness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the production environment file}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'X-Forwarded-Proto: https' http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: deployment/caddy/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FITNESS_HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backup:
    image: postgres:17
    profiles: [maintenance]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-fitness_production}
      PGUSER: ${POSTGRES_USER:-fitness}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the production environment file}
      BACKUP_KIND: ${BACKUP_KIND:-daily}
      DAILY_BACKUP_RETENTION_COUNT: ${DAILY_BACKUP_RETENTION_COUNT:-14}
      PRE_DEPLOY_BACKUP_RETENTION_COUNT: ${PRE_DEPLOY_BACKUP_RETENTION_COUNT:-10}
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    volumes:
      - ./deployment/backup:/scripts:ro
      - type: bind
        source: ${FITNESS_BACKUP_DIRECTORY:?Set FITNESS_BACKUP_DIRECTORY in the production environment file}
        target: /backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  verify-backup:
    image: postgres:17
    profiles: [maintenance]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-fitness_production}
      PGUSER: ${POSTGRES_USER:-fitness}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the production environment file}
      BACKUP_FILE: ${BACKUP_FILE:-}
    entrypoint: ["/bin/sh", "/scripts/verify.sh"]
    volumes:
      - ./deployment/backup:/scripts:ro
      - type: bind
        source: ${FITNESS_BACKUP_DIRECTORY:?Set FITNESS_BACKUP_DIRECTORY in the production environment file}
        target: /backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  restore:
    image: postgres:17
    profiles: [maintenance]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-fitness_production}
      PGUSER: ${POSTGRES_USER:-fitness}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the production environment file}
      BACKUP_FILE: ${BACKUP_FILE:-}
      CONFIRM_RESTORE: ${CONFIRM_RESTORE:-}
    entrypoint: ["/bin/sh", "/scripts/restore.sh"]
    volumes:
      - ./deployment/backup:/scripts:ro
      - type: bind
        source: ${FITNESS_BACKUP_DIRECTORY:?Set FITNESS_BACKUP_DIRECTORY in the production environment file}
        target: /backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    internal: true
  frontend:

volumes:
  postgres_data:
