name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: Rails API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fitness_test
          POSTGRES_PASSWORD: fitness
          POSTGRES_USER: fitness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitness -d fitness_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://fitness:fitness@localhost:5432/fitness_test
      RAILS_ENV: test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpq-dev
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: api
      - name: Prepare database
        run: bin/rails db:prepare
      - name: Test
        run: bin/rails test
      - name: Lint
        run: bin/rubocop
      - name: Security scan
        run: bin/brakeman --no-pager

  web:
    name: React Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm run test
      - run: npm run build
      - run: npm audit --audit-level=moderate

  ios:
    name: SwiftUI iOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Build for testing
        run: xcodebuild -project FitnessApp.xcodeproj -scheme FitnessApp -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build-for-testing

  compose:
    name: Compose Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate development configuration
        run: docker compose config --quiet
      - name: Validate production configuration
        run: docker compose --env-file deployment/production.env.example -f compose.production.yml config --quiet
      - name: Build production images
        run: docker compose --env-file deployment/production.env.example -f compose.production.yml build api web
      - name: Validate backup scripts
        run: sh -n deployment/backup/*.sh
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem deployment/scripts/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref] $tokens,
              [ref] $errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List
              exit 1
            }
          }
      - name: Exercise fresh deployment checkout
        shell: pwsh
        run: |
          $repositoryPath = Join-Path $env:RUNNER_TEMP "deployment-origin"
          $sourcePath = Join-Path $env:RUNNER_TEMP "fresh-deployment-checkout"
          & git init --initial-branch=main $repositoryPath
          & git -C $repositoryPath config user.email "ci@example.com"
          & git -C $repositoryPath config user.name "CI"
          Set-Content -LiteralPath (Join-Path $repositoryPath "README.md") -Value "deployment fixture"
          & git -C $repositoryPath add README.md
          & git -C $repositoryPath commit --message "test: create deployment fixture"
          $commitSha = (& git -C $repositoryPath rev-parse HEAD).Trim()
          & ./deployment/scripts/checkout.ps1 `
            -CommitSha $commitSha `
            -RepositoryUrl $repositoryPath `
            -SourcePath $sourcePath

          $checkedOutCommit = (& git -C $sourcePath rev-parse HEAD).Trim()
          $workingTreeChanges = @(& git -C $sourcePath status --porcelain)
          if ($checkedOutCommit -ne $commitSha -or $workingTreeChanges.Count -gt 0) {
            throw "Fresh deployment checkout was not clean at the requested commit"
          }
      - name: Exercise backup and restore
        env:
          FITNESS_BACKUP_DIRECTORY: ${{ runner.temp }}/fitness-backups
        run: |
          set -euo pipefail
          mkdir -p "$FITNESS_BACKUP_DIRECTORY"
          docker compose --env-file deployment/production.env.example -f compose.production.yml up -d --wait postgres api
          docker compose --env-file deployment/production.env.example -f compose.production.yml exec -T api \
            bin/rails runner 'Exercise.create!(name: "Backup Verification", primary_muscle_group: "test", load_type: "none")'
          docker compose --env-file deployment/production.env.example -f compose.production.yml run --rm \
            -e BACKUP_KIND=daily backup
          sleep 1
          docker compose --env-file deployment/production.env.example -f compose.production.yml run --rm \
            -e BACKUP_KIND=daily -e DAILY_BACKUP_RETENTION_COUNT=1 backup
          backup_count=$(find "$FITNESS_BACKUP_DIRECTORY" -maxdepth 1 -type f -name 'fitness-daily-*.dump' | wc -l)
          test "$backup_count" -eq 1
          backup_path=$(find "$FITNESS_BACKUP_DIRECTORY" -maxdepth 1 -type f -name 'fitness-daily-*.dump' -print -quit)
          test -n "$backup_path"
          backup_file=$(basename "$backup_path")
          docker compose --env-file deployment/production.env.example -f compose.production.yml run --rm \
            -e BACKUP_FILE="$backup_file" verify-backup &
          first_verification_pid=$!
          docker compose --env-file deployment/production.env.example -f compose.production.yml run --rm \
            -e BACKUP_FILE="$backup_file" verify-backup &
          second_verification_pid=$!
          first_verification_status=0
          second_verification_status=0
          wait "$first_verification_pid" || first_verification_status=$?
          wait "$second_verification_pid" || second_verification_status=$?
          test "$first_verification_status" -eq 0
          test "$second_verification_status" -eq 0
          corrupt_backup_file="fitness-corrupt.dump"
          docker compose --env-file deployment/production.env.example -f compose.production.yml run --rm \
            --entrypoint /bin/sh -e BACKUP_FILE="$backup_file" verify-backup -c '
              source="/backups/$BACKUP_FILE"
              target="/backups/fitness-corrupt.dump"
              cp "$source" "$target"
              backup_size=$(stat --format=%s "$target")
              truncate --size=$((backup_size / 2)) "$target"
            '
          if docker compose --env-file deployment/production.env.example -f compose.production.yml run --rm \
            -e BACKUP_FILE="$corrupt_backup_file" verify-backup; then
            echo "Corrupt backup unexpectedly passed verification" >&2
            exit 1
          fi
          docker compose --env-file deployment/production.env.example -f compose.production.yml exec -T api \
            bin/rails runner 'Exercise.find_by!(name: "Backup Verification").destroy!; ApplicationRecord.connection.create_table(:post_backup_records) { |table| table.string :name }'
          docker compose --env-file deployment/production.env.example -f compose.production.yml stop api
          docker compose --env-file deployment/production.env.example -f compose.production.yml run --rm \
            -e CONFIRM_RESTORE=yes -e BACKUP_FILE="$backup_file" restore
          docker compose --env-file deployment/production.env.example -f compose.production.yml up -d --wait api
          docker compose --env-file deployment/production.env.example -f compose.production.yml exec -T api \
            bin/rails runner 'raise "record missing after restore" unless Exercise.exists?(name: "Backup Verification"); raise "post-backup table survived restore" if ApplicationRecord.connection.data_source_exists?(:post_backup_records)'
      - name: Clean up backup rehearsal
        if: always()
        env:
          FITNESS_BACKUP_DIRECTORY: ${{ runner.temp }}/fitness-backups
        run: docker compose --env-file deployment/production.env.example -f compose.production.yml down --volumes --remove-orphans

  deploy:
    name: Deploy production
    needs: [api, web, ios, compose]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Connect to production tailnet
        uses: tailscale/github-action@a392da0a182bba0e9613b6243ebd69529b1878aa # v4.1.0
        with:
          oauth-client-id: ${{ vars.TAILSCALE_OIDC_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_OIDC_AUDIENCE }}
          tags: tag:github-deploy
          ping: ${{ vars.PRODUCTION_SSH_HOST }}
      - name: Configure deployment SSH key
        env:
          SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/production_key
          chmod 600 ~/.ssh/production_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host production
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/production_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 15
            ServerAliveCountMax 4
          EOF
          chmod 600 ~/.ssh/config
      - name: Deploy verified commit
        env:
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          scp deployment/scripts/deploy.ps1 deployment/scripts/checkout.ps1 production:
          ssh production "powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File deploy.ps1 -CommitSha $DEPLOY_COMMIT_SHA"
      - name: Remove deployment SSH key
        if: always()
        run: rm -f ~/.ssh/production_key
