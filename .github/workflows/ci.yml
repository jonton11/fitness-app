name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: Rails API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fitness_test
          POSTGRES_PASSWORD: fitness
          POSTGRES_USER: fitness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitness -d fitness_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://fitness:fitness@localhost:5432/fitness_test
      RAILS_ENV: test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpq-dev
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: api
      - name: Prepare database
        run: bin/rails db:prepare
      - name: Test
        run: bin/rails test
      - name: Lint
        run: bin/rubocop
      - name: Security scan
        run: bin/brakeman --no-pager

  web:
    name: React Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm run test
      - run: npm run build
      - run: npm audit --audit-level=moderate

  ios:
    name: SwiftUI iOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Build for testing
        run: xcodebuild -project FitnessApp.xcodeproj -scheme FitnessApp -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build-for-testing

  compose:
    name: Compose Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Windows checkout line endings
        run: |
          set -euo pipefail
          checkout="$RUNNER_TEMP/windows-autocrlf-checkout"
          commit=$(git rev-parse HEAD)
          git clone --no-checkout --no-local . "$checkout"
          git -C "$checkout" config core.autocrlf true
          git -C "$checkout" checkout --force "$commit"

          has_crlf=false
          while IFS= read -r file; do
            if LC_ALL=C grep --quiet $'\r' "$checkout/$file"; then
              echo "CRLF line endings found in $file" >&2
              has_crlf=true
            fi
          done < <(git -C "$checkout" ls-files 'api/bin/*' '*.sh')

          test "$has_crlf" = false
      - name: Validate development configuration
        run: docker compose config --quiet
      - name: Validate production configuration
        run: docker compose --env-file deployment/production.env.example -f compose.production.yml config --quiet
      - name: Build production images
        run: docker compose --env-file deployment/production.env.example -f compose.production.yml build api web
      - name: Validate backup scripts
        run: sh -n deployment/backup/*.sh
      - name: Validate deployment scripts
        run: bash -n deployment/scripts/*.sh
      - name: Validate backup systemd units
        run: |
          set -euo pipefail
          if ! id fitness-app >/dev/null 2>&1; then
            sudo useradd --system --user-group --no-create-home fitness-app
          fi
          sudo install -d /usr/local/lib/fitness-app
          sudo install -m 755 deployment/scripts/backup-job.sh \
            /usr/local/lib/fitness-app/backup-job.sh
          systemd-analyze verify \
            deployment/systemd/fitness-app-backup.service \
            deployment/systemd/fitness-app-backup.timer
      - name: Exercise backup job with configured data root
        run: |
          set -euo pipefail
          data_root="$RUNNER_TEMP/custom-fitness-root"
          scripts_directory="$data_root/source/deployment/scripts"
          deployment_config="$RUNNER_TEMP/backup-job.env"
          calls_file="$RUNNER_TEMP/backup-job-calls"
          expected_calls_file="$RUNNER_TEMP/expected-backup-job-calls"
          mkdir -p "$scripts_directory"
          printf '%s\n' "FITNESS_DATA_ROOT=$data_root" > "$deployment_config"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'printf "backup:%s\n" "$1" >> "$BACKUP_JOB_CALLS"' > "$scripts_directory/backup.sh"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'printf "replicate\n" >> "$BACKUP_JOB_CALLS"' > "$scripts_directory/replicate-backups.sh"
          chmod +x "$scripts_directory/backup.sh" "$scripts_directory/replicate-backups.sh"

          BACKUP_JOB_CALLS="$calls_file" \
            FITNESS_DEPLOYMENT_CONFIG="$deployment_config" \
            ./deployment/scripts/backup-job.sh

          printf '%s\n' backup:daily replicate > "$expected_calls_file"
          diff --unified "$expected_calls_file" "$calls_file"
      - name: Exercise OCI backup replication
        run: |
          set -euo pipefail
          backup_directory="$RUNNER_TEMP/replication-backups"
          fake_bin="$RUNNER_TEMP/replication-bin"
          deployment_config="$RUNNER_TEMP/replication.env"
          arguments_file="$RUNNER_TEMP/oci-arguments"
          expected_arguments_file="$RUNNER_TEMP/expected-oci-arguments"
          mkdir -p "$backup_directory" "$fake_bin"
          truncate --size=129M "$backup_directory/fitness-daily-20261012T030000Z.dump"
          touch "$backup_directory/ignored.txt"
          printf '%s\n' \
            "FITNESS_BACKUP_DIRECTORY=$backup_directory" \
            "OCI_BACKUP_NAMESPACE=test-namespace" \
            "OCI_BACKUP_BUCKET=test-bucket" \
            "OCI_BACKUP_PREFIX=production" > "$deployment_config"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'printf "%s\n" "$@" > "$OCI_ARGUMENTS_FILE"' > "$fake_bin/oci"
          chmod +x "$fake_bin/oci"

          PATH="$fake_bin:$PATH" \
            OCI_ARGUMENTS_FILE="$arguments_file" \
            FITNESS_DEPLOYMENT_CONFIG="$deployment_config" \
            ./deployment/scripts/replicate-backups.sh

          printf '%s\n' \
            os object sync \
            --auth instance_principal \
            --namespace-name test-namespace \
            --bucket-name test-bucket \
            --src-dir "$backup_directory" \
            --prefix production/ \
            --include '*.dump' \
            --no-multipart \
            --no-follow-symlinks > "$expected_arguments_file"
          diff --unified "$expected_arguments_file" "$arguments_file"
      - name: Exercise deployment checkout safeguards
        run: |
          set -euo pipefail
          repository_path="$RUNNER_TEMP/deployment-origin"
          source_path="$RUNNER_TEMP/deployment-checkout"
          git init --initial-branch=main "$repository_path"
          git -C "$repository_path" config user.email "ci@example.com"
          git -C "$repository_path" config user.name "CI"
          printf '%s\n' "deployment fixture" > "$repository_path/README.md"
          git -C "$repository_path" add README.md
          git -C "$repository_path" commit --message "test: create deployment fixture"
          main_commit=$(git -C "$repository_path" rev-parse HEAD)

          ./deployment/scripts/checkout.sh "$main_commit" "$repository_path" "$source_path"
          test "$(git -C "$source_path" rev-parse HEAD)" = "$main_commit"
          test -z "$(git -C "$source_path" status --porcelain)"

          printf '%s\n' "dirty" >> "$source_path/README.md"
          if ./deployment/scripts/checkout.sh "$main_commit" "$repository_path" "$source_path"; then
            echo "Dirty deployment checkout was unexpectedly accepted" >&2
            exit 1
          fi
          git -C "$source_path" restore README.md

          git -C "$repository_path" switch --create unmerged
          printf '%s\n' "unmerged" > "$repository_path/unmerged.txt"
          git -C "$repository_path" add unmerged.txt
          git -C "$repository_path" commit --message "test: create unmerged commit"
          unmerged_commit=$(git -C "$repository_path" rev-parse HEAD)
          git -C "$source_path" fetch origin unmerged
          if ./deployment/scripts/checkout.sh "$unmerged_commit" "$repository_path" "$source_path"; then
            echo "Commit outside main was unexpectedly accepted" >&2
            exit 1
          fi
      - name: Exercise operator deployment handoff
        run: |
          set -euo pipefail
          fixture_root="$RUNNER_TEMP/operator-deploy"
          mkdir -p "$fixture_root"
          fixture_root=$(cd "$fixture_root" && pwd -P)
          repository_path="$fixture_root/repository"
          origin_path="$fixture_root/origin.git"
          fake_bin="$fixture_root/bin"
          calls_file="$fixture_root/calls"
          operator_config="$fixture_root/operator.env"
          mkdir -p "$repository_path/deployment/scripts" "$fake_bin"
          git init --bare --initial-branch=main "$origin_path"
          git -C "$repository_path" init --initial-branch=main
          git -C "$repository_path" config user.email "ci@example.com"
          git -C "$repository_path" config user.name "CI"
          cp deployment/scripts/deploy-remote.sh \
            deployment/scripts/deploy.sh deployment/scripts/checkout.sh \
            "$repository_path/deployment/scripts/"
          git -C "$repository_path" add deployment/scripts
          git -C "$repository_path" commit --message "test: create operator deployment fixture"
          git -C "$repository_path" remote add origin "$origin_path"
          git -C "$repository_path" push origin main
          deployment_commit=$(git -C "$repository_path" rev-parse HEAD)
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'printf "ssh:%s\n" "$*" >> "$DEPLOY_CALLS_FILE"' > "$fake_bin/ssh"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'printf "scp:%s\n" "$*" >> "$DEPLOY_CALLS_FILE"' > "$fake_bin/scp"
          chmod +x "$fake_bin/ssh" "$fake_bin/scp"
          printf '%s\n' \
            'FITNESS_PRODUCTION_SSH_TARGET=fitness-production' \
            'FITNESS_DEPLOY_REPOSITORY_URL=https://github.com/example/fitness-app.git' \
            > "$operator_config"

          (
            cd "$repository_path"
            PATH="$fake_bin:$PATH" \
              DEPLOY_CALLS_FILE="$calls_file" \
              FITNESS_OPERATOR_CONFIG="$operator_config" \
              ./deployment/scripts/deploy-remote.sh "$deployment_commit"
          )

          grep --fixed-strings \
            "scp:$repository_path/deployment/scripts/deploy.sh $repository_path/deployment/scripts/checkout.sh fitness-production:.local/lib/fitness-app/" \
            "$calls_file"
          grep --fixed-strings \
            "ssh:fitness-production chmod 700 .local/lib/fitness-app/deploy.sh .local/lib/fitness-app/checkout.sh && .local/lib/fitness-app/deploy.sh $deployment_commit https://github.com/example/fitness-app.git" \
            "$calls_file"

          printf '\n%s\n' "# local modification" >> \
            "$repository_path/deployment/scripts/deploy-remote.sh"
          if (
            cd "$repository_path"
            PATH="$fake_bin:$PATH" \
              DEPLOY_CALLS_FILE="$calls_file" \
              FITNESS_OPERATOR_CONFIG="$operator_config" \
              ./deployment/scripts/deploy-remote.sh "$deployment_commit"
          ); then
            echo "Modified operator deployment script was unexpectedly accepted" >&2
            exit 1
          fi
          test "$(grep --count '^scp:' "$calls_file")" -eq 1
          test "$(grep --count '^ssh:' "$calls_file")" -eq 2
          git -C "$repository_path" restore deployment/scripts/deploy-remote.sh

          printf '%s\n' "unmerged" > "$repository_path/unmerged.txt"
          git -C "$repository_path" add unmerged.txt
          git -C "$repository_path" commit --message "test: create unmerged operator commit"
          unmerged_commit=$(git -C "$repository_path" rev-parse HEAD)
          if (
            cd "$repository_path"
            PATH="$fake_bin:$PATH" \
              DEPLOY_CALLS_FILE="$calls_file" \
              FITNESS_OPERATOR_CONFIG="$operator_config" \
              ./deployment/scripts/deploy-remote.sh "$unmerged_commit"
          ); then
            echo "Commit outside origin/main was unexpectedly handed off" >&2
            exit 1
          fi
          test "$(grep --count '^scp:' "$calls_file")" -eq 1
          test "$(grep --count '^ssh:' "$calls_file")" -eq 2
      - name: Exercise backup and restore
        env:
          FITNESS_BACKUP_DIRECTORY: ${{ runner.temp }}/fitness-backups
        run: |
          set -euo pipefail
          mkdir -p "$FITNESS_BACKUP_DIRECTORY"
          docker compose --env-file deployment/production.env.example -f compose.production.yml up -d --wait postgres api
          docker compose --env-file deployment/production.env.example -f compose.production.yml exec -T api \
            bin/rails runner 'Exercise.create!(name: "Backup Verification", primary_muscle_group: "test", load_type: "none")'
          docker compose --env-file deployment/production.env.example -f compose.production.yml run --rm \
            -e BACKUP_KIND=daily backup
          sleep 1
          docker compose --env-file deployment/production.env.example -f compose.production.yml run --rm \
            -e BACKUP_KIND=daily -e DAILY_BACKUP_RETENTION_COUNT=1 backup
          backup_count=$(find "$FITNESS_BACKUP_DIRECTORY" -maxdepth 1 -type f -name 'fitness-daily-*.dump' | wc -l)
          test "$backup_count" -eq 1
          backup_path=$(find "$FITNESS_BACKUP_DIRECTORY" -maxdepth 1 -type f -name 'fitness-daily-*.dump' -print -quit)
          test -n "$backup_path"
          backup_file=$(basename "$backup_path")
          docker compose --env-file deployment/production.env.example -f compose.production.yml run --rm \
            -e BACKUP_FILE="$backup_file" verify-backup &
          first_verification_pid=$!
          docker compose --env-file deployment/production.env.example -f compose.production.yml run --rm \
            -e BACKUP_FILE="$backup_file" verify-backup &
          second_verification_pid=$!
          first_verification_status=0
          second_verification_status=0
          wait "$first_verification_pid" || first_verification_status=$?
          wait "$second_verification_pid" || second_verification_status=$?
          test "$first_verification_status" -eq 0
          test "$second_verification_status" -eq 0
          corrupt_backup_file="fitness-corrupt.dump"
          docker compose --env-file deployment/production.env.example -f compose.production.yml run --rm \
            --entrypoint /bin/sh -e BACKUP_FILE="$backup_file" verify-backup -c '
              source="/backups/$BACKUP_FILE"
              target="/backups/fitness-corrupt.dump"
              cp "$source" "$target"
              backup_size=$(stat --format=%s "$target")
              truncate --size=$((backup_size / 2)) "$target"
            '
          if docker compose --env-file deployment/production.env.example -f compose.production.yml run --rm \
            -e BACKUP_FILE="$corrupt_backup_file" verify-backup; then
            echo "Corrupt backup unexpectedly passed verification" >&2
            exit 1
          fi
          docker compose --env-file deployment/production.env.example -f compose.production.yml exec -T api \
            bin/rails runner 'Exercise.find_by!(name: "Backup Verification").destroy!; ApplicationRecord.connection.create_table(:post_backup_records) { |table| table.string :name }'
          docker compose --env-file deployment/production.env.example -f compose.production.yml stop api
          docker compose --env-file deployment/production.env.example -f compose.production.yml run --rm \
            -e CONFIRM_RESTORE=yes -e BACKUP_FILE="$backup_file" restore
          docker compose --env-file deployment/production.env.example -f compose.production.yml up -d --wait api
          docker compose --env-file deployment/production.env.example -f compose.production.yml exec -T api \
            bin/rails runner 'raise "record missing after restore" unless Exercise.exists?(name: "Backup Verification"); raise "post-backup table survived restore" if ApplicationRecord.connection.data_source_exists?(:post_backup_records)'
      - name: Clean up backup rehearsal
        if: always()
        env:
          FITNESS_BACKUP_DIRECTORY: ${{ runner.temp }}/fitness-backups
        run: docker compose --env-file deployment/production.env.example -f compose.production.yml down --volumes --remove-orphans

  production_arm64:
    name: Production ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner architecture
        run: test "$(uname -m)" = "aarch64"
      - name: Build production images
        run: docker compose --env-file deployment/production.env.example -f compose.production.yml build api web
      - name: Start production stack
        env:
          FITNESS_BACKUP_DIRECTORY: ${{ runner.temp }}/fitness-arm64-backups
        run: |
          mkdir -p "$FITNESS_BACKUP_DIRECTORY"
          docker compose --env-file deployment/production.env.example -f compose.production.yml up -d --wait
      - name: Verify production health
        run: curl --fail --show-error http://127.0.0.1:8080/health
      - name: Clean up production stack
        if: always()
        env:
          FITNESS_BACKUP_DIRECTORY: ${{ runner.temp }}/fitness-arm64-backups
        run: docker compose --env-file deployment/production.env.example -f compose.production.yml down --volumes --remove-orphans
